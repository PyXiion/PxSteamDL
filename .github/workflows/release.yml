name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release (if false, only builds artifacts)"
        type: boolean
        default: false
      tag_name:
        description: "Release tag (e.g. v0.1.0, required if publish is true)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  check:
    name: Check the version
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag_name != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A release is tagged vX.Y.Z, with X.Y.Z in project(PxSteamDL VERSION ...) and a section in CHANGELOG.md.
      - name: Tag, version and changelog agree
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          expected=$(sed -n 's/^project(PxSteamDL VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$TAG" != "v$expected" ]; then
            echo "::error::Tag $TAG does not match the version $expected in CMakeLists.txt"
            exit 1
          fi
          npm_version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').version")
          if [ "$npm_version" != "$expected" ] || [ "$lock_version" != "$expected" ]; then
            echo "::error::package.json ($npm_version) and package-lock.json ($lock_version) must have the version $expected from CMakeLists.txt"
            exit 1
          fi
          if ! grep -q "^## \[$expected\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $expected"
            exit 1
          fi

  binaries:
    name: binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: pxsteamdl-linux-x86_64
            archive_name: pxsteamdl-linux-x86_64.tar.gz
            pack_type: tar
          - os: macos-latest
            artifact_name: pxsteamdl-macos-arm64
            archive_name: pxsteamdl-macos-arm64.tar.gz
            pack_type: tar
          - os: windows-latest
            artifact_name: pxsteamdl-windows-x64
            archive_name: pxsteamdl-windows-x64.zip
            pack_type: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: .cpm-cache
          key: cpm-bin-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt') }}

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: matrix.os == 'windows-latest'

      - name: Install Ninja
        if: matrix.os != 'windows-latest'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qy && sudo apt-get install -qy ninja-build
          else
            brew install ninja
          fi

      - name: Configure
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPXSTEAMDL_BUILD_CLI=ON -DPXSTEAMDL_BUILD_PYTHON=OFF

      - name: Build CLI
        run: cmake --build build --target pxsteamdl-cli --config Release

      - name: Strip binary (Linux/macOS)
        if: matrix.pack_type == 'tar'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            strip -s build/pxsteamdl
          else
            strip build/pxsteamdl
          fi

      - name: Package (tar.gz)
        if: matrix.pack_type == 'tar'
        run: |
          mkdir -p staging/${{ matrix.artifact_name }} dist
          cp build/pxsteamdl COPYING COPYING.LESSER README.md staging/${{ matrix.artifact_name }}/
          tar -czvf dist/${{ matrix.archive_name }} -C staging ${{ matrix.artifact_name }}

      - name: Package (zip)
        if: matrix.pack_type == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging\${{ matrix.artifact_name }} -Force
          Copy-Item build\pxsteamdl.exe, COPYING, COPYING.LESSER, README.md staging\${{ matrix.artifact_name }}\
          New-Item -ItemType Directory -Path dist -Force
          Compress-Archive -Path staging\${{ matrix.artifact_name }} -DestinationPath dist\${{ matrix.archive_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  wheels:
    name: wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CIBW_ENVIRONMENT_LINUX: CPM_SOURCE_CACHE=/tmp/cpm-cache
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        if: runner.os != 'Linux'
        with:
          path: .cpm-cache
          key: cpm-wheels-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - uses: pypa/cibuildwheel@v4.2.1

      - name: Wheel sizes
        shell: bash
        run: ls -l wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ runner.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # The Node.js addon for each platform, shipped inside the npm package (node/install.js builds from source elsewhere).
  # Node-API makes one binary work for every Node.js version.
  node-prebuilds:
    name: node addon (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
          - name: darwin-arm64
            os: macos-latest
          - name: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/cache@v6
        if: matrix.container == ''
        with:
          path: .cpm-cache
          key: cpm-node-prebuild-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'

      # manylinux ships a compiler but an old CMake.
      - name: Install CMake and Ninja (manylinux)
        if: matrix.container != ''
        run: |
          /opt/python/cp312-cp312/bin/pip install cmake ninja
          echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build
        run: |
          npm install --ignore-scripts
          npx cmake-js compile --out build-node --CDPXSTEAMDL_BUILD_NODE=ON --CDPXSTEAMDL_BUILD_CLI=OFF --CDPXSTEAMDL_INSTALL=OFF
          mkdir -p prebuilds/${{ matrix.name }}
          cp node/native/pxsteamdl-addon.node prebuilds/${{ matrix.name }}/
          ls -l prebuilds/${{ matrix.name }}

      - name: Dependencies of the addon
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            ldd prebuilds/${{ matrix.name }}/pxsteamdl-addon.node
            objdump -T prebuilds/${{ matrix.name }}/pxsteamdl-addon.node | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          else
            otool -L prebuilds/${{ matrix.name }}/pxsteamdl-addon.node
          fi

      - name: Load check
        run: node -e "require('./node/prebuild').prebuiltPath() || process.exit(1); console.log(require('./node').version)"

      - uses: actions/upload-artifact@v7
        with:
          name: node-prebuild-${{ matrix.name }}
          path: prebuilds
          if-no-files-found: error

  npm:
    name: Publish to npm
    needs: [check, node-prebuilds]
    if: always() && needs.node-prebuilds.result == 'success' && needs.check.result != 'failure'
    runs-on: ubuntu-latest
    # The pending trusted publisher on npmjs.com names this workflow and the npm environment.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          path: prebuilds
          pattern: node-prebuild-*
          merge-multiple: true

      - name: Pack
        run: |
          find prebuilds -type f
          npm pack
          ls -l pxsteamdl-*.tgz

      # The tarball must work without building anything: install it without scripts and log in to Steam.
      - name: Try the tarball
        run: |
          mkdir "$RUNNER_TEMP/consumer-node"
          cd "$RUNNER_TEMP/consumer-node"
          npm init -y
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/pxsteamdl-*.tgz
          node -e "require('pxsteamdl').Client.create().then(() => console.log('logged in'))"

      # Trusted publishing (OIDC): no token. Only for a tag; a manual run stops after the checks above.
      - name: Publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npm publish --provenance --access public pxsteamdl-*.tgz

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true

      - name: List distributions
        run: ls -l dist

      # Trusted publishing: no API token; the pending publisher on pypi.org names this workflow and the pypi environment.
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Publish Release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag_name != '')
    needs: [check, binaries, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The release notes are the changelog section of this version.
      - name: Release notes
        shell: bash
        run: |
          version=$(sed -n 's/^project(PxSteamDL VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          cat release-notes.md

      - uses: actions/download-artifact@v8
        with:
          path: release_assets
          pattern: "{binary-*,wheels-*,sdist}"
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          echo "=== Release Assets & Checksums ==="
          cat SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: release_assets/*
          body_path: release-notes.md
