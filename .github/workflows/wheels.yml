name: Wheels

on:
  push:
    tags: ["v*"]
    branches: [crossplatform] # TEMP: workflow_dispatch needs the file on main; removed before merge
  workflow_dispatch:

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Linux builds run in a manylinux container; there the cache only spans the Python versions of one job.
      CIBW_ENVIRONMENT_LINUX: CPM_SOURCE_CACHE=/tmp/cpm-cache
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        if: runner.os != 'Linux'
        with:
          path: .cpm-cache
          key: cpm-wheels-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - uses: pypa/cibuildwheel@v4.2.1

      - name: Wheel sizes
        shell: bash
        run: ls -l wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ runner.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
