name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Binary size
        run: |
          exe=build/pxsteamdl${{ runner.os == 'Windows' && '.exe' || '' }}
          ls -l "$exe"
          if [ "$RUNNER_OS" != Windows ]; then cp "$exe" stripped && strip stripped && ls -l stripped; fi
          if [ "$RUNNER_OS" = Linux ]; then ldd "$exe"; fi
          if [ "$RUNNER_OS" = macOS ]; then otool -L "$exe"; fi

      - name: Smoke test
        run: |
          mods="$RUNNER_TEMP/mods"
          ./build/pxsteamdl -o "$mods" 2009463077
          test -f "$mods/2009463077/About/About.xml"
          # A damaged file must be replaced (rename over an existing file).
          expected=$(cksum < "$mods/2009463077/About/About.xml")
          echo damaged >> "$mods/2009463077/About/About.xml"
          ./build/pxsteamdl -o "$mods" 2009463077
          test "$(cksum < "$mods/2009463077/About/About.xml")" = "$expected"

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/cache@v6
        with:
          path: .cpm-cache
          key: cpm-python-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install package
        run: python -m pip install .

      - name: Smoke test
        run: python .github/smoke_test.py
