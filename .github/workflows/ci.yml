name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Ubuntu's libcurl is too old for WebSockets (needs >= 8.11 with ws support).
    container: archlinux:latest
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel cmake ninja curl openssl zlib xz zstd git

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Smoke test
        run: |
          ./build/pxsteamdl -o /tmp/mods 2009463077
          test -f /tmp/mods/2009463077/About/About.xml

  python:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel cmake ninja curl openssl zlib xz zstd git python python-pip

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-python-${{ hashFiles('CMakeLists.txt') }}

      - name: Install package
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install .
          # The runner rejects an absolute path as `shell:`, so put the venv first on PATH instead.
          echo /tmp/venv/bin >> "$GITHUB_PATH"

      - name: Smoke test
        shell: python {0}
        run: |
          import asyncio, pathlib, threading, pxsteamdl
          results = pxsteamdl.Client().download([2009463077], "/tmp/mods", on_progress=lambda p: None)
          print(results)
          assert results[0].ok, results[0].error
          assert (results[0].path / "About" / "About.xml").is_file()

          async def download_async():
              client = await pxsteamdl.AsyncClient.create()
              loop_thread = threading.get_ident()
              calls = []
              def on_progress(p):
                  assert threading.get_ident() == loop_thread
                  calls.append(p)
              results = await client.download([2009463077], "/tmp/mods-async", on_progress=on_progress)
              print(results)
              assert results[0].ok, results[0].error
              assert (results[0].path / "About" / "About.xml").is_file()
              assert calls

          asyncio.run(download_async())
