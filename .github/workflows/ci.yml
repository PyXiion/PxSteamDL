name: CI

# Pull requests are checked by the pull_request event; push covers main only, so a PR commit runs once and tags
# (built by the Release workflow) do not rerun CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes its running check; every commit on main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPXSTEAMDL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # Style (see CONTRIBUTING.md): formatting and naming, checked once with pinned LLVM 18 tools.
      - name: clang-format
        if: runner.os == 'Linux'
        run: clang-format-18 --dry-run --Werror src/*.cpp src/*.hpp include/pxsteamdl/*.hpp cli/main.cpp python/pxsteamdl.cpp tests/*.cpp tests/*.hpp tests/fakes/*.?pp

      - name: clang-tidy
        if: runner.os == 'Linux'
        run: clang-tidy-18 -p build --quiet src/*.cpp cli/main.cpp tests/*.cpp tests/fakes/*.cpp

      - name: Binary size
        run: |
          exe=build/pxsteamdl${{ runner.os == 'Windows' && '.exe' || '' }}
          ls -l "$exe"
          if [ "$RUNNER_OS" != Windows ]; then cp "$exe" stripped && strip stripped && ls -l stripped; fi
          if [ "$RUNNER_OS" = Linux ]; then ldd "$exe"; fi
          if [ "$RUNNER_OS" = macOS ]; then otool -L "$exe"; fi

      - name: CLI check
        run: |
          status=0
          ./build/pxsteamdl || status=$?
          test "$status" -eq 2
          # The version printed is the one in CMakeLists.txt.
          expected=$(sed -n 's/^project(PxSteamDL VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "$(./build/pxsteamdl --version | tr -d '\r')" = "pxsteamdl $expected"

      # Downloads real items from Steam. Not on Windows, where the download hangs on GitHub runners (under
      # investigation).
      - name: Smoke test
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: |
          mods="$RUNNER_TEMP/mods"
          ./build/pxsteamdl -o "$mods" 2009463077 818773962
          test -f "$mods/2009463077/About/About.xml"
          test -f "$mods/818773962/About/About.xml"
          # A damaged file must be replaced (rename over an existing file).
          expected=$(cksum < "$mods/2009463077/About/About.xml")
          echo damaged >> "$mods/2009463077/About/About.xml"
          ./build/pxsteamdl -o "$mods" 2009463077
          test "$(cksum < "$mods/2009463077/About/About.xml")" = "$expected"
          # An unknown item fails alone, with exit code 1 and a readable reason.
          status=0
          ./build/pxsteamdl -o "$mods" 2009463077 1 > "$RUNNER_TEMP/out.txt" || status=$?
          cat "$RUNNER_TEMP/out.txt"
          test "$status" -eq 1
          grep -q "Steam rejected the item: not found (EResult 9)" "$RUNNER_TEMP/out.txt"

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/cache@v6
        with:
          path: .cpm-cache
          key: cpm-python-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install package
        run: python -m pip install .

      - name: Import check
        run: python -c "import pxsteamdl; print(pxsteamdl.__version__, pxsteamdl.Client, pxsteamdl.AsyncClient, pxsteamdl.CancelToken)"

      - name: Smoke test
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: python -u .github/smoke_test.py
