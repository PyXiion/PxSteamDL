# SPDX-License-Identifier: LGPL-3.0-or-later
[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "pxsteamdl"
dynamic = ["version"]
description = "Anonymous Steam Workshop (RimWorld) downloader"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]

[project.urls]
Homepage = "https://github.com/PyXiion/PxSteamDL"
Source = "https://github.com/PyXiion/PxSteamDL"
Issues = "https://github.com/PyXiion/PxSteamDL/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
# abi3 wheel for CPython >= 3.12 (nanobind STABLE_ABI); older versions get version-specific wheels.
wheel.py-api = "cp312"
# Only our module and stub; the statically linked dependencies install nothing into the wheel.
install.components = ["python"]

[tool.scikit-build.metadata.version]
# Single source: project(PxSteamDL VERSION ...) in CMakeLists.txt.
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(PxSteamDL VERSION (?P<value>[0-9.]+)'

[tool.scikit-build.cmake.define]
PXSTEAMDL_BUILD_PYTHON = "ON"
PXSTEAMDL_BUILD_CLI = "OFF"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
build-verbosity = 1
test-command = "python -u {project}/.github/smoke_test.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
